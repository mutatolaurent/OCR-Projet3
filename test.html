<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html {
        /* On force la base à 10px (62.5% de 16px) */
        font-size: 62.5%;
      }
      .s-16px {
        font-size: 16px;
      }
      .s-32px {
        font-size: 32px;
      }
      .s-48px {
        font-size: 48px;
      }
      .s-1rem {
        font-size: 1.6rem;
      }
      .s-2rem {
        font-size: 3.2rem;
      }
      .s-3rem {
        font-size: 4.8rem;
      }
      .btn {
        font-size: 2rem;
        padding: 0.6em 1.2em;
        border-radius: 0.4em;
      }

      .btn-large {
        font-size: 1.4rem;
      }
    </style>
  </head>
  <body>
    <p class="s-16px">Teste en 16px</p>
    <p class="s-1rem">Teste en 1rem</p>
    <p class="s-32px">Teste en 32px</p>
    <p class="s-2rem">Teste en 2rem</p>
    <p class="s-48px">Teste en 48px</p>
    <p class="s-3rem">Teste en 3rem</p>
    <button class="btn">Valider</button>
    <button class="btn btn-large">Valider</button>
  </body>
</html>
